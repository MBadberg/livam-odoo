name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (lint & format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  test:
    name: Odoo tests (19.0)
    runs-on: ubuntu-22.04
    container: ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    env:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: odoo
      DB_PASSWORD: odoo
      DB_NAME: odoo
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Initialize test database
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
