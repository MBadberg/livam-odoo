# Ruff configuration (mirrors the pre-commit hooks in .pre-commit-config.yaml).
# Odoo `__init__.py` files import submodules for their registration side
# effects; ruff's F401 would otherwise flag those as unused imports.

line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
