# Basis-Hooks für das Repo. Die vollständigen OCA-Hooks
# (oca-gen-addon-readme, oca-gen-addons-table, ...) werden beim
# Modul-Scaffolding ergänzt.
exclude: "^setup/|/static/lib/|/i18n/|README.rst$|/docs/"
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
